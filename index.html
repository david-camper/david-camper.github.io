<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Beyond The Stars</title>
  <meta name="description" content="Beyond The Stars — official artist website.">

  <!-- Favicons (same as the template) -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts (same families the template already loads) -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <!-- Shared site typography (blackletter display font + book serif) -->
  <link href="assets/css/fonts.css" rel="stylesheet">

  <!--
    ============================================================
    LANDING PAGE — Beyond The Stars
    ------------------------------------------------------------
    Files this page expects (create these folders/files):
      assets/video/background.mp4      looping signature background
      assets/video/background.webm     (optional, smaller alternative)
      assets/img/landing-poster.jpg    still frame shown while video loads
      assets/video/logo.webm           looping logo (transparent WebM works)
      assets/video/logo.mp4            (optional fallback)
      assets/img/logo.png              logo image (used for the spin option)

    Pick ONE logo mode below by setting data-logo-mode on <body>:
      "video" -> plays your looping logo video
      "spin"  -> spins a static logo image with CSS (no video needed)

    ENTER_URL is where the entry phrase and the logo send visitors.
    ============================================================
  -->

  <style>
    :root {
      --bg: #05060a;
      --text: #f2f2f7;
      --accent: #9fb7ff;
      --glow: rgba(159, 183, 255, 0.55);
      --logo-size: clamp(160px, 28vw, 320px);
      --spin-duration: 12s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--default-font, "EB Garamond", "Times New Roman", serif);
      overflow: hidden;
    }

    /* ---------- Background video ---------- */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;          /* fills screen on any aspect ratio */
      z-index: -2;
    }

    /* Dark overlay keeps the logo and text readable over any footage */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(5,6,10,0.15) 0%, rgba(5,6,10,0.75) 100%);
      z-index: -1;
    }

    /* ---------- Centered content ---------- */
    .landing {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      text-align: center;
      padding: 1.5rem;
      opacity: 0;
      animation: fadeIn 1.6s ease forwards 0.3s;
    }

    .logo-link {
      display: block;
      width: var(--logo-size);
      height: var(--logo-size);
      border-radius: 50%;
      outline-offset: 8px;
      transition: transform 0.4s ease, filter 0.4s ease;
      filter: drop-shadow(0 0 18px var(--glow));
    }
    .logo-link:hover,
    .logo-link:focus-visible {
      transform: scale(1.05);
      filter: drop-shadow(0 0 32px var(--glow));
    }

    .logo-video,
    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Only show the element for the chosen mode */
    body[data-logo-mode="video"] .logo-img   { display: none; }
    body[data-logo-mode="spin"]  .logo-video { display: none; }
    body[data-logo-mode="spin"]  .logo-img   { animation: spin var(--spin-duration) linear infinite; }

    /* ---------- "Proceed?" ---------- */
    .proceed {
      font-family: var(--display-font, "UnifrakturMaguntia", "Times New Roman", serif);
      font-weight: 400;
      font-size: clamp(1.8rem, 4.2vw, 3rem);
      letter-spacing: 0.02em;       /* blackletter needs tight spacing */
      text-transform: none;         /* never all-caps with blackletter */
      line-height: 1.2;
      color: var(--text);
      text-decoration: none;
      padding: 0.2em 0.4em;
      border-bottom: 1px solid transparent;
      text-shadow: 0 0 18px rgba(0, 0, 0, 0.8);
      animation: pulse 3s ease-in-out infinite;
      transition: color 0.3s ease, border-color 0.3s ease, text-shadow 0.3s ease;
    }
    .proceed:hover,
    .proceed:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
      text-shadow: 0 0 24px var(--glow);
      animation-play-state: paused;
    }

    /* ---------- Exit transition ---------- */
    body.leaving .landing,
    body.leaving .bg-video {
      transition: opacity 0.8s ease, transform 0.8s ease;
      opacity: 0;
      transform: scale(1.08);
    }

    /* ---------- Animations ---------- */
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes pulse  { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    /* ---------- Accessibility: respect reduced-motion settings ---------- */
    @media (prefers-reduced-motion: reduce) {
      .bg-video { display: none; }
      html, body { background: var(--bg) url("assets/img/landing-poster.jpg") center / cover no-repeat; }
      .logo-img, .proceed, .landing { animation: none !important; opacity: 1; }
    }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
  </style>
</head>

<!-- Change to data-logo-mode="spin" to use a spinning image instead of a logo video -->
<body data-logo-mode="video">

  <!-- Background: muted + playsinline are REQUIRED for autoplay on phones/browsers -->
  <video class="bg-video" autoplay muted loop playsinline preload="auto"
         poster="assets/img/landing-poster.jpg" aria-hidden="true">
    <source src="assets/video/background.webm" type="video/webm">
    <source src="assets/video/background.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay" aria-hidden="true"></div>

  <main class="landing">
    <h1 class="visually-hidden">Beyond The Stars</h1>

    <!-- Clickable logo (works in both modes) -->
    <a class="logo-link js-enter" href="home.html" aria-label="Enter Beyond The Stars">
      <video class="logo-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
        <source src="assets/video/logo.webm" type="video/webm">
        <source src="assets/video/logo.mp4" type="video/mp4">
      </video>
      <img class="logo-img" src="assets/img/logo.png" alt="">
    </a>

    <a class="proceed js-enter" href="home.html">Unsheathe your heart?</a>
  </main>

  <script>
    // Where the landing page sends visitors
    const ENTER_URL = "home.html";

    // Smooth fade-out before navigating (plain link still works if JS is off)
    document.querySelectorAll(".js-enter").forEach(link => {
      link.addEventListener("click", e => {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        e.preventDefault();
        document.body.classList.add("leaving");
        setTimeout(() => { window.location.href = ENTER_URL; }, 750);
      });
    });

    // If a browser blocks autoplay, try again on first interaction
    const vids = document.querySelectorAll("video");
    vids.forEach(v => v.play().catch(() => {
      document.addEventListener("pointerdown", () => v.play(), { once: true });
    }));
  </script>
</body>

</html>
